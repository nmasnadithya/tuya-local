name: EV charger
products:
  - id: altsclkea1ahx3md
    manufacturer: TKT
    model: EV Charger
entities:
  - entity: sensor
    class: energy
    translation_key: energy_consumed
    category: diagnostic
    dps:
      - id: 1   # forward_energy_total
        type: integer
        name: sensor
        range:
          min: 0
          max: 999999
        class: total_increasing
        unit: kWh
        force: true
        mapping:
          - scale: 100
  - entity: sensor
    class: enum
    translation_key: status
    icon: "mdi:ev-station"
    dps:
      - id: 3   # work_state
        type: string
        name: sensor
        mapping:
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_pause
            value: paused
          - dps_val: charger_end
            value: charged
          - dps_val: charger_fault
            value: fault
  - entity: number
    name: Charging Current
    category: config
    class: current
    icon: "mdi:ev-plug-type2"
    dps:
      - id: 4   # charge_cur_set
        type: integer
        name: value
        unit: A
        optional: true
        range:
          min: 6
          max: 32
  - entity: sensor
    translation_key: voltage_x
    translation_placeholders:
      x: A
    class: voltage
    dps:
      - id: 6   # phase_a
        type: base64
        name: sensor
        optional: true
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        force: true
        precision: 1
        mapping:
          - scale: 10
  - entity: sensor
    translation_key: current_x
    translation_placeholders:
      x: A
    class: current
    dps:
      - id: 6   # phase_a
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    translation_key: power_x
    translation_placeholders:
      x: A
    class: power
    dps:
      - id: 6   # phase_a
        type: base64
        name: sensor
        optional: true
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    translation_key: voltage_x
    translation_placeholders:
      x: B
    class: voltage
    hidden: true
    dps:
      - id: 7   # phase_b
        type: base64
        name: sensor
        optional: true
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        precision: 1
        mapping:
          - scale: 10
  - entity: sensor
    translation_key: current_x
    translation_placeholders:
      x: B
    class: current
    hidden: true
    dps:
      - id: 7   # phase_b
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    translation_key: power_x
    translation_placeholders:
      x: B
    class: power
    hidden: true
    dps:
      - id: 7   # phase_b
        type: base64
        name: sensor
        optional: true
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: sensor
    translation_key: voltage_x
    translation_placeholders:
      x: C
    class: voltage
    hidden: true
    dps:
      - id: 8   # phase_c
        type: base64
        name: sensor
        optional: true
        unit: V
        class: measurement
        mask: "FFFF000000000000"
        precision: 1
        mapping:
          - scale: 10
  - entity: sensor
    translation_key: current_x
    translation_placeholders:
      x: C
    class: current
    hidden: true
    dps:
      - id: 8   # phase_c
        type: base64
        name: sensor
        optional: true
        unit: A
        class: measurement
        mask: "0000FFFFFF000000"
        mapping:
          - scale: 1000
  - entity: sensor
    translation_key: power_x
    translation_placeholders:
      x: C
    class: power
    hidden: true
    dps:
      - id: 8   # phase_c
        type: base64
        name: sensor
        optional: true
        unit: kW
        class: measurement
        mask: "0000000000FFFFFF"
        mapping:
          - scale: 1000
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 10  # fault sensor
        type: bitfield
        name: sensor
        optional: true
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 10  # fault code
        type: bitfield
        name: fault_code
        optional: true
      - id: 10  # fault desc
        type: bitfield
        name: description
        optional: true
        mapping:
          - dps_val: null
            value: "No data"
          - dps_val: 0
            value: "Ok"
          - dps_val: 1
            value: "Over Current Alarm (ov_cr)"
          - dps_val: 2
            value: "Over Current Fault (ov2_cr_fault)"
          - dps_val: 4
            value: "Over Voltage Alarm (ov_vol)"
          - dps_val: 8
            value: "Under Voltage Alarm (undervoltage_alarm)"
          - dps_val: 16
            value: "Contactor Adhesion (contactor_adhesion)"
          - dps_val: 32
            value: "Contactor Fault (contactor_fault)"
          - dps_val: 64
            value: "Earth Fault (earth_fault)"
          - dps_val: 128
            value: "Meter Hardware Alarm (meter_hardware_alarm)"
          - dps_val: 256
            value: "Scram Fault (scram_fault)"
          - dps_val: 512
            value: "Control Pilot Fault (cp_fault)"
          - dps_val: 1024
            value: "Meter Communication Fault (meter_commu_fault)"
          - dps_val: 2048
            value: "Card Reader Fault (card_reader_fault)"
          - dps_val: 4096
            value: "Circuit Short Fault (cir_short_fault)"
          - dps_val: 8192
            value: "Adhesion Fault (adhesion_fault)"
          - dps_val: 16384
            value: "Self Test Alarm (self_test_alarm)"
          - dps_val: 32768
            value: "Leakage Current Alarm (leakagecurr_alarm)"
  - entity: switch
    name: Alarm Over Current
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: switch
        mask: "00FF000000000000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: number
    name: Alarm Over Current Threshold
    category: diagnostic
    class: current
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: value
        unit: A
        mask: "0000FFFF00000000000000000000000000000000"
        range:
          min: 1
          max: 32
  - entity: switch
    name: Alarm Over Voltage
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: switch
        mask: "0000000000FF0000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: number
    name: Alarm Over Voltage Threshold
    category: diagnostic
    class: voltage
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: value
        unit: V
        mask: "000000000000FFFF000000000000000000000000"
        range:
          min: 10
          max: 400
        mapping:
          - scale: 10
  - entity: switch
    name: Alarm Under Voltage
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: switch
        mask: "000000000000000000FF00000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: number
    name: Alarm Under Voltage Threshold
    category: diagnostic
    class: voltage
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: value
        unit: V
        mask: "00000000000000000000FFFF0000000000000000"
        range:
          min: 10
          max: 400
        mapping:
          - scale: 10
  - entity: switch
    name: Alarm Contactor Adhesion
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: switch
        mask: "00000000000000000000000000FF000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Ground Fault
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 11  # alarm_set_1
        type: base64
        name: switch
        mask: "0000000000000000000000000000000000FF0000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Scram Fault
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 12  # alarm_set_2
        type: base64
        name: switch
        mask: "00FF000000000000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Control Pilot Abnormal
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 12  # alarm_set_2
        type: base64
        name: switch
        mask: "0000000000FF0000000000000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Meter Communication Fault
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 12  # alarm_set_2
        type: base64
        name: switch
        mask: "000000000000000000FF00000000000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Card Reader Fault
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 12  # alarm_set_2
        type: base64
        name: switch
        mask: "00000000000000000000000000FF000000000000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true
  - entity: switch
    name: Alarm Leakage Fault
    category: diagnostic
    icon: "mdi:alarm-light"
    dps:
      - id: 12  # alarm_set_2
        type: base64
        name: switch
        mask: "0000000000000000000000000000000000FF0000"
        mapping:
          - dps_val: 0
            value: false
          - dps_val: 2
            value: true

  # Connection state (CP pilot)
  - entity: sensor
    name: Connection
    icon: "mdi:ev-plug-type2"
    class: enum
    category: diagnostic
    dps:
      - id: 13  # connection_state
        type: string
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: Standby
          - dps_val: controlpi_12v_pwm
            value: Communication initialising
          - dps_val: controlpi_9v
            value: Vehicle detected
          - dps_val: controlpi_9v_pwm
            value: Vehicle connected
          - dps_val: controlpi_6v
            value: Ready to charge
          - dps_val: controlpi_6v_pwm
            value: Charging
          - dps_val: controlpi_error
            value: Error

  # Charging mode
  - entity: select
    translation_key: charging_mode
    category: config
    dps:
      - id: 14  # work_mode
        type: string
        name: option
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_pct
            value: charge_to_percent
          - dps_val: charge_energy
            value: fixed_charge
          - dps_val: charge_schedule
            value: scheduled_charge
  - entity: sensor
    name: Remaining available power
    category: diagnostic
    hidden: true
    class: energy
    dps:
      - id: 15  # balance_energy
        type: integer
        optional: true
        name: sensor
        unit: kWh
        class: measurement
        range:
          min: 0
          max: 99999999
        mapping:
          - scale: 100
  - entity: button
    name: Reset energy counter
    class: restart
    category: diagnostic
    hidden: true
    dps:
      - id: 16  # clear_energy
        type: boolean
        optional: true
        name: button
  - entity: switch
    icon: "mdi:ev-station"
    dps:
      - id: 18  # switch
        type: boolean
        name: switch
  - entity: time
    name: Charge Start Time
    category: config
    dps:
      - id: 19  # local_timer
        type: base64
        name: hour
        mask: "FF00"
  - entity: time
    name: Charge End Time
    category: config
    dps:
      - id: 19  # local_timer
        type: base64
        name: hour
        mask: "00FF"
  - entity: sensor
    name: System Version
    category: diagnostic
    hidden: true
    dps:
      - id: 23  # system_version
        type: string
        name: sensor
        optional: true
        persist: true
  - entity: sensor
    name: Last session energy
    class: energy_storage
    dps:
      - id: 25  # charge_energy_once
        type: integer
        name: sensor
        optional: true
        unit: kWh
        class: measurement
        mapping:
          - scale: 100
  - entity: switch
    name: Online State
    category: diagnostic
    icon: "mdi:web"
    hidden: true
    dps:
      - id: 27  # online_state
        type: string
        name: switch
        mapping:
          - dps_val: offline
            value: false
          - dps_val: online
            value: true
  - entity: text
    name: Charger ID
    icon: "mdi:identifier"
    category: diagnostic
    range:
      min: 1
      max: 255
    dps:
      - id: 101 # charger_id
        type: string
        name: value
        sensitive: true
        optional: true
        persist: true
  - entity: text
    name: Server URL
    category: diagnostic
    icon: "mdi:link"
    range:
      min: 1
      max: 255
    dps:
      - id: 102 # server_url
        type: string
        name: value
        sensitive: true
        optional: true
        persist: true
  - entity: number
    name: Load Current Limit
    category: config
    class: current
    dps:
      - id: 103 # load_current_limit
        type: integer
        name: value
        unit: A
        optional: true
        range:
          min: 1
          max: 32
  - entity: sensor
    name: Load Current
    class: current
    dps:
      - id: 104 # load_current
        type: integer
        name: sensor
        optional: true
        unit: A
        class: measurement
        force: true
        range:
          min: 0
          max: 1000
        mapping:
          - scale: 10
  - entity: switch
    name: Load Balance Switch
    category: diagnostic
    icon: "mdi:meter-electric"
    hidden: true
    dps:
      - id: 105 # load_balance_switch
        type: boolean
        name: switch
